<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ljay</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; overflow: hidden; }
      #root { position: fixed; inset: 0; }
      #stage { position: absolute; inset: 0; }
      #stage canvas { width: 100% !important; height: 100% !important; display: block; }
      #lyrics { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6em; padding: 0 6vw; text-align: center; z-index: 5; }

      /* Floating launcher chip — replaces the old top bar.
         All real controls live in /control.html now. The chip just lets the
         operator open the panel or copy its URL onto a phone/iPad. */
      #launcher {
        position: fixed; top: 8px; right: 8px; z-index: 10;
        display: flex; align-items: center; gap: 6px;
        padding: 6px 10px;
        background: rgba(0,0,0,0.45);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 999px;
        font-size: 11px;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        color: rgba(255,255,255,0.7);
        opacity: 0.25;
        transition: opacity 200ms ease, background 200ms ease;
      }
      #launcher:hover, #launcher:focus-within { opacity: 1; background: rgba(0,0,0,0.7); }
      #launcher .dot {
        width: 8px; height: 8px; border-radius: 8px;
        background: #888; transition: background 200ms ease, box-shadow 200ms ease;
      }
      #launcher.connected .dot { background: #7cffb2; box-shadow: 0 0 6px #7cffb2; }
      #launcher.connecting .dot { background: #ffd84a; box-shadow: 0 0 6px #ffd84a80; }
      #launcher .bpm { font-variant-numeric: tabular-nums; opacity: 0.85; }
      #launcher .actions {
        display: none; gap: 6px; margin-left: 4px;
        padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.12);
      }
      #launcher:hover .actions, #launcher:focus-within .actions { display: flex; }
      #launcher button {
        background: rgba(255,255,255,0.08); color: #fff;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 999px; padding: 3px 10px;
        font: inherit; cursor: pointer;
      }
      #launcher button:hover { background: rgba(255,255,255,0.18); }
      #launcher .copied { color: #7cffb2; font-style: italic; padding: 3px 4px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="stage"></div>
      <div id="lyrics"></div>
      <div id="launcher" tabindex="0" title="Ljay — controls live in the panel">
        <span class="dot"></span>
        <span class="bpm" id="launcher-bpm" style="display: none;"></span>
        <span class="actions">
          <button id="launcher-open" title="Open the control panel in a new window">Open Panel</button>
          <button id="launcher-copy" title="Copy the panel URL to clipboard">Copy URL</button>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
