<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ljay — Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; --sans: 'Inter Tight', 'Inter', Helvetica, system-ui, sans-serif; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background: #0a0a0c; color: #e8eaee; font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
      body { overscroll-behavior: none; touch-action: manipulation; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      input, select { font: inherit; color: inherit; }
      .panel-scroll { overflow: auto; scrollbar-width: thin; }
      .panel-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
      .panel-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
      .panel-scroll::-webkit-scrollbar-track { background: transparent; }
      .no-select { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/control/main.tsx"></script>
  </body>
</html>
